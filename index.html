<title>AH-Begleiter</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0c09; --panel: #17130d; --panel2: #1f1a12; --line: #3a2f1d;
    --text: #ece2cc; --muted: #9a8e76; --accent: #f2c14e; --accent2: #c99a3a;
    --up: #5fd17a; --down: #ef6b5b; --warn: #f0a83c;
    --gold: #ffd34d; --silver: #c9ccd1; --copper: #d08a52;
    --q-poor: #9d9d9d; --q-common: #f2f2f2; --q-uncommon: #1eff00; --q-rare: #3a9bff;
    --q-epic: #b866ff; --q-legendary: #ff8000;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", -apple-system, Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }

  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px; }
  .brand { font: 700 17px Georgia, serif; color: var(--accent); white-space: nowrap; }
  .ctrl { display: flex; gap: 6px; align-items: center; }
  .ctrl label { color: var(--muted); font-size: 12px; }
  select, input[type=text], input[type=number] { background: var(--panel2); border: 1px solid var(--line);
    border-radius: 5px; padding: 4px 7px; min-width: 0; }
  input[type=number] { width: 90px; }
  .status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); display: inline-block; }
  .dot.busy { background: var(--warn); animation: pulse 1s infinite; }
  .dot.err { background: var(--down); }
  @keyframes pulse { 50% { opacity: .3; } }

  nav { display: flex; gap: 2px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line);
    overflow-x: auto; position: sticky; top: var(--hdr, 49px); z-index: 4; }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px;
    color: var(--muted); white-space: nowrap; }
  nav button.on { color: var(--accent); border-bottom-color: var(--accent); }
  nav button .badge { background: var(--down); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; margin-left: 4px; }

  main { padding: 12px 14px 40px; max-width: 1400px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
  .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; }
  .btn:hover { border-color: var(--accent2); }
  .btn.primary { background: #3b2d12; border-color: var(--accent2); color: var(--accent); }
  .btn.small { padding: 1px 7px; font-size: 12px; }
  .muted { color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; }
  .err { color: var(--down); }

  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 5px 8px; border-bottom: 1px solid #2a2216; text-align: left; vertical-align: middle; }
  th { color: var(--accent2); font-weight: 600; font-size: 12px; white-space: nowrap; position: sticky; top: 0; background: var(--bg); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--accent); }
  td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #1d1810; }
  tr.alert td { background: #1f2a14; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }

  .item { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
  .item img { width: 22px; height: 22px; border-radius: 3px; border: 1px solid #000; flex: none; }
  .item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-POOR { color: var(--q-poor); } .q-COMMON { color: var(--q-common); } .q-UNCOMMON { color: var(--q-uncommon); }
  .q-RARE { color: var(--q-rare); } .q-EPIC { color: var(--q-epic); } .q-LEGENDARY { color: var(--q-legendary); }

  .money { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .money .g { color: var(--gold); } .money .s { color: var(--silver); } .money .c { color: var(--copper); }
  .money i { font-style: normal; font-size: 10px; margin: 0 3px 0 1px; opacity: .85; }
  .up { color: var(--up); } .down { color: var(--down); }

  .search { position: relative; flex: 1 1 260px; max-width: 420px; }
  .search input { width: 100%; }
  .results { position: absolute; top: 100%; left: 0; right: 0; z-index: 20; background: var(--panel2);
    border: 1px solid var(--accent2); border-radius: 0 0 6px 6px; max-height: 360px; overflow-y: auto; }
  .results div { padding: 5px 8px; display: flex; justify-content: space-between; gap: 8px; align-items: center; cursor: pointer; }
  .results div:hover, .results div.sel { background: #2c2416; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 10px 0; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
  .card .k { font-size: 11px; color: var(--muted); }
  .card .v { font-size: 15px; margin-top: 2px; }

  /* Detail panel */
  #detail { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--panel);
    border-left: 1px solid var(--accent2); z-index: 30; overflow-y: auto; transform: translateX(100%);
    transition: transform .18s ease; padding: 14px 16px 30px; box-shadow: -10px 0 30px #0008; }
  #detail.open { transform: none; }
  #detail h2 { margin: 0; font: 700 19px Georgia, serif; }
  #detail h3 { font-size: 13px; color: var(--accent2); margin: 18px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  .close { position: absolute; top: 10px; right: 12px; background: none; border: 0; font-size: 22px; color: var(--muted); }
  .chart { width: 100%; height: 200px; display: block; }
  .chart text { fill: var(--muted); font-size: 10px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .legend b { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 4px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .seg button { background: var(--panel2); border: 0; padding: 3px 9px; font-size: 12px; color: var(--muted); }
  .seg button.on { background: #3b2d12; color: var(--accent); }

  .reagents { padding: 6px 8px 10px 38px; background: #14100b; }
  .reagents table td { border: 0; padding: 2px 8px; }
  footer { color: var(--muted); font-size: 11px; padding: 10px 14px 20px; }
  .empty { padding: 26px; text-align: center; color: var(--muted); }
  /* Als App auf dem Home-Bildschirm: nicht unter Uhrzeit/Notch rutschen */
  header { padding-top: max(8px, env(safe-area-inset-top)); padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
  footer { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
  #detail { padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: max(30px, env(safe-area-inset-bottom)); }
  .close { top: max(10px, env(safe-area-inset-top)); }
  @media (max-width: 700px) {
    header { padding: 8px 10px; } main { padding: 10px 8px 30px; }
    .status { margin-left: 0; width: 100%; }
    th, td { padding: 4px 5px; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<header id="hdr">
  <div class="brand">⚖ AH-Begleiter</div>
  <div class="ctrl"><label for="region">Region</label><select id="region"></select></div>
  <div class="ctrl"><label for="house">Auktionshaus</label><select id="house"></select></div>
  <div class="ctrl"><label for="refresh">Auto</label>
    <select id="refresh">
      <option value="5">alle 5 Min.</option><option value="10">alle 10 Min.</option>
      <option value="15">alle 15 Min.</option><option value="30">alle 30 Min.</option><option value="0">aus</option>
    </select>
    <button class="btn small" id="reload" title="Jetzt neu laden">↻</button>
  </div>
  <div class="status"><span id="snap">–</span><span><span class="dot" id="dot"></span> <span id="net">bereit</span></span></div>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<aside id="detail" aria-hidden="true"></aside>
<footer>Daten: <a href="https://forever-ah.com" target="_blank" rel="noopener">Forever AH</a> · Blizzard Battle.net API.
  Preise werden etwa stündlich aktualisiert. Nicht mit Blizzard verbunden. Nur für den privaten Gebrauch.</footer>

<script>
"use strict";
/* ---------- Grundlagen ---------- */
const API = "https://forever-ah.com/v1";
const MIN_GAP = 1100;            // ~1 Anfrage pro Sekunde (Bitte des Betreibers)
const TTL = 5 * 60 * 1000;       // Cache 5 Minuten

const store = {
  get(k, d) { try { const v = localStorage.getItem("ahb." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ahb." + k, JSON.stringify(v)); } catch {} },
};
const $ = (s) => document.querySelector(s);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.style.cssText = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}

/* ---------- API mit Drosselung, Cache und 429-Behandlung ---------- */
const cache = new Map(), inflight = new Map();
let queue = Promise.resolve(), lastReq = 0, pending = 0;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function netState(state, text) { $("#dot").className = "dot " + state; $("#net").textContent = text; }
function api(path, params, ttl = TTL) {
  const qs = params ? new URLSearchParams(Object.entries(params).filter(([, v]) => v !== "" && v != null)).toString() : "";
  const url = API + path + (qs ? "?" + qs : "");
  const hit = cache.get(url);
  if (hit && Date.now() - hit.t < ttl) return Promise.resolve(hit.d);
  if (inflight.has(url)) return inflight.get(url);
  pending++; netState("busy", `lädt (${pending})`);
  const p = queue.then(async () => {
    for (let attempt = 0; ; attempt++) {
      const wait = lastReq + MIN_GAP - Date.now();
      if (wait > 0) await sleep(wait);
      lastReq = Date.now();
      let res;
      try { res = await fetch(url); }

  let timer, items = [], sel = -1;
  function show() {

      itemCell(it), el("span", { class: "hint", text: it.item_class || "" }))));
    list.hidden = !items.length;
  }
  function pick(it) { input.value = ""; items = []; show(); onPick(it); }

    clearTimeout(timer);

function chart(pts, res) {
  const W = 540, H = 200, L = 58, R = 8, T = 10, B = 22;
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("class", "chart");
  const mk = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const data = pts.filter((p) => p.min_unit != null);
  if (data.length < 2) {
    const wrap = el("p", { class: "hint", text: "Zu wenig Verlaufsdaten für ein Diagramm." }); return wrap;
  }
  const series = [["median_unit", "#f2c14e"], ["p10_unit", "#5fb8d1"], ["min_unit", "#7fd17a"]];
  const vals = data.flatMap((p) => [p.min_unit, p.p10_unit, p.median_unit]).filter((v) => v != null).sort((a, b) => a - b);
  // Ausreißer kappen (95. Perzentil), damit einzelne Mondpreise die Skala nicht zerstören
  const hi = vals[Math.floor(vals.length * 0.95)] * 1.08 || 1, lo = Math.max(0, vals[0] * 0.92);
  const t0 = +new Date(data[0].ts), t1 = +new Date(data[data.length - 1].ts);
  const x = (t) => L + ((t - t0) / (t1 - t0 || 1)) * (W - L - R);
  const y = (v) => T + (1 - (Math.min(v, hi) - lo) / (hi - lo || 1)) * (H - T - B);
  for (let i = 0; i <= 4; i++) {
    const v = lo + ((hi - lo) * i) / 4, yy = y(v);
    svg.append(mk("line", { x1: L, x2: W - R, y1: yy, y2: yy, stroke: "#2a2216" }));
    const t = mk("text", { x: L - 5, y: yy + 3, "text-anchor": "end" }); t.textContent = moneyText(v); svg.append(t);
  }
  const fmt = res === "hour" ? { day: "2-digit", month: "2-digit", hour: "2-digit" } : { day: "2-digit", month: "2-digit" };
  for (let i = 0; i <= 4; i++) {
    const tt = t0 + ((t1 - t0) * i) / 4;
    const t = mk("text", { x: x(tt), y: H - 6, "text-anchor": i === 0 ? "start" : i === 4 ? "end" : "middle" });
    t.textContent = new Date(tt).toLocaleString("de-DE", fmt); svg.append(t);
  }
  for (const [k, c] of series) {
    if (!data.some((p) => p[k] != null)) continue;
    const d = data.filter((p) => p[k] != null).map((p, i) => `${i ? "L" : "M"}${x(+new Date(p.ts)).toFixed(1)},${y(p[k]).toFixed(1)}`).join("");
    svg.append(mk("path", { d, fill: "none", stroke: c, "stroke-width": k === "median_unit" ? 2 : 1.4, opacity: k === "min_unit" ? .8 : 1 }));
  }
  const cursor = mk("line", { y1: T, y2: H - B, stroke: "#8a7f6a", "stroke-dasharray": "3 3", visibility: "hidden" });
  svg.append(cursor);
  const tip = el("div", { class: "hint", style: "min-height:18px;margin-top:2px" });
  svg.addEventListener("mousemove", (e) => {
    const r = svg.getBoundingClientRect();
    const t = t0 + (((e.clientX - r.left) / r.width) * W - L) / (W - L - R) * (t1 - t0);
    let best = data[0]; for (const p of data) if (Math.abs(+new Date(p.ts) - t) < Math.abs(+new Date(best.ts) - t)) best = p;
    const xx = x(+new Date(best.ts)); cursor.setAttribute("x1", xx); cursor.setAttribute("x2", xx); cursor.setAttribute("visibility", "visible");
    tip.replaceChildren(new Date(best.ts).toLocaleString("de-DE", fmt), " · Günstigstes ", money(best.min_unit), " · 10 % ", money(best.p10_unit),
      " · Median ", money(best.median_unit), ` · ${nf.format(best.quantity)} Stk.`);
  });
  svg.addEventListener("mouseleave", () => { cursor.setAttribute("visibility", "hidden"); tip.textContent = ""; });
  return el("div", null, svg, el("div", { class: "legend" },
    el("span", null, el("b", { style: "background:#f2c14e" }), "Median"),
    data.some((p) => p.p10_unit != null) ? el("span", null, el("b", { style: "background:#5fb8d1" }), "10 %-Preis") : null,
    el("span", null, el("b", { style: "background:#7fd17a" }), "Günstigstes")), tip);
}

    .sort((a, b) => (a.house_type === "unified" ? -1 : b.house_type === "unified" ? 1 : a.house_id - b.house_id));
  if (!hs.some((h) => String(h.house_key) === String(S.house))) S.house = hs[0]?.house_key ?? null;
  $("#house").replaceChildren(...hs.map((h) => el("option", { value: h.house_key, selected: String(h.house_key) === String(S.house) }, houseLabel(h))));
}

// Auf claude.ai läuft die Seite in einer Umgebung ohne freien Netzzugriff → Connector nutzen.
async function detectMode() {
  if (MCP) return;
  if (window.claude && typeof window.claude.use === "function") {
    $("#view").replaceChildren(el("div", { class: "empty", text: "Verbinde mit dem Connector …" }));
    try { MCP = await window.claude.use("mcp"); } catch { MCP = null; }
    if (MCP) { MODE = "mcp"; return; }
  }
  MODE = "rest";
}
async function start() {
  try {
    await detectMode();
    if (S.house == null) S.house = store.get("house." + MODE, null);
    await loadHouses();
  } catch (e) {
    $("#view").replaceChildren(e.code ? errorBox(e) : el("div", { class: "empty err", text: "Konnte die Auktionshäuser nicht laden: " + e.message }));
    return;
  }
  fixNavOffset();
  render();
}
function init() {
  $("#refresh").value = String(S.refresh);
  $("#refresh").addEventListener("change", (e) => { S.refresh = Number(e.target.value); save(); });
  $("#reload").addEventListener("click", async () => {
    cache.clear();
    if (isMcp()) await MCP.invalidate(SERVER).catch(() => {});
    loadHouses(true).then(render, (e) => $("#view").replaceChildren(errorBox(e)));
  });
  $("#region").addEventListener("change", (e) => { S.region = e.target.value; fillHouseSelects(); save(); closeDetail(); render(); });
  $("#house").addEventListener("change", (e) => { S.house = isMcp() ? e.target.value : Number(e.target.value); save(); closeDetail(); render(); });
  fixNavOffset(); drawTabs();
  start();
  // Automatische Aktualisierung (nur wenn das Fenster sichtbar ist oder Zielpreise beobachtet werden)
  setInterval(async () => {
    if (!S.houses.length) return;
    updateSnap();
    if (!S.refresh || Date.now() - S.lastLoad < S.refresh * 60000) return;
    if (document.hidden && !(S.tab === "watch" && S.watch.some((w) => w.target != null))) return;
    if (isMcp()) await MCP.invalidate(SERVER).catch(() => {});
    await loadHouses(true).catch(() => {});
    render();
  }, 30000);
}
async function loadHouses(force) {
  S.houses = isMcp() ? ((await mcpCall("list_houses", {})).houses || []).map(slugHouse)
                     : await api("/houses", null, force ? 0 : TTL);
  fillHouseSelects(); save(); updateSnap();
}
init();
</script>
